services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace}
    ports:
      - "5432:5432"
    volumes:
      - marketplace_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketplace} -d ${POSTGRES_DB:-marketplace}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - marketplace-network

  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    ports:
      - "6379:6379"
    volumes:
      - marketplace_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - marketplace-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: marketplace-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - marketplace_zk_data:/var/lib/zookeeper/data
      - marketplace_zk_log:/var/lib/zookeeper/log
    networks:
      - marketplace-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: marketplace-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - marketplace_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - marketplace-network

  # Uncomment to run backend in Docker (requires Dockerfile to be built)
  # backend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: marketplace-backend
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     kafka:
  #       condition: service_healthy
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SPRING_PROFILES_ACTIVE: local
  #     POSTGRES_USER: ${POSTGRES_USER:-marketplace}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace}
  #     POSTGRES_DB: ${POSTGRES_DB:-marketplace}
  #     JWT_SECRET: ${JWT_SECRET}
  #     DELIVERY_CODE_SECRET: ${DELIVERY_CODE_SECRET}
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  #   networks:
  #     - marketplace-network

volumes:
  marketplace_pg_data:
  marketplace_redis_data:
  marketplace_kafka_data:
  marketplace_zk_data:
  marketplace_zk_log:

networks:
  marketplace-network:
    driver: bridge
